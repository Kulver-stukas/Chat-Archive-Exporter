<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body class="popup">
  <header><div class="logo">CA</div><div><h1>Chat Archive Exporter</h1><small>Markdown · Queued export</small></div></header>
