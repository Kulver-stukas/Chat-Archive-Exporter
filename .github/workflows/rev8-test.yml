name: Test rev.8 patch
on:
  push:
    branches: ['fix/v0.1.9-rev8']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node regression suites
        run: |
          set -euo pipefail
          for test in tests/*.test.js; do echo "::group::$test"; node "$test"; echo "::endgroup::"; done
      - name: Syntax and package checks
        run: |
          set -euo pipefail
          for js in *.js lib/*.js ui/*.js; do node --check "$js"; done
          python3 tools/package_extension.py dist/chat-archive-exporter-v0.1.9-rev8-test.zip
          python3 tools/package_store.py dist/chat-archive-exporter-v0.1.9-rev8-webstore-candidate.zip
      - uses: actions/upload-artifact@v4
        with:
          name: chat-archive-exporter-v0.1.9-rev8
          path: dist/*.zip
